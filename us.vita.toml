# DK64 US with cooperative frame pacing and the desktop port's 240p mode.
[input]
entrypoint = 0x80000400
symbols_file_path = "DK64Syms/dump.toml"
rom_file_path = "donkeykong64.decompressed.us.z64"
output_func_path = "build/RecompiledFuncsVita"
manual_funcs = [
    { name = "func_global_asm_80612794", section = ".global_asm", vram = 0x80612794, size = 0x6C }
]
function_sizes = [
    { name = "func_global_asm_80612790", size = 0x70 },
    { name = "func_global_asm_80612794", size = 0x6C },
    { name = "func_global_asm_80612D10", size = 0x130 }
]

[patches]
ignored = ["D_global_asm_80611F0C", "D_global_asm_8071FA80", "D_global_asm_8061ACA0"]

[[patches.hook]]
func = "func_dk64_boot_800005A8"
text = """{
    int32_t ovl_rom_start = 0x113F0;
    int32_t ovl_ram = 0x805FB300;
    int32_t uncompressed_size = 0x1DE360;
    load_dk64_overlay(ovl_rom_start, ovl_ram, uncompressed_size);
}"""
before_vram = 0x80000734

[[patches.hook]]
func = "func_global_asm_8060B140"
text = "load_dk64_overlay(ctx->r4, 0, 0);"
before_vram = 0x8060B140

# Preserve the desktop patch's minimum lag and cooperative waiting.
[[patches.hook]]
func = "func_global_asm_80600674"
text = "{ extern void dk64_vita_calculate_lag(uint8_t*); dk64_vita_calculate_lag(rdram); return; }"

# Match timing_fixes.c: only fast loads bypass the frame deadline.
[[patches.hook]]
func = "func_global_asm_8060F730"
before_vram = 0x8060F780
text = "{ extern int32_t dk64_vita_frame_delta(uint8_t*); ctx->r2 = dk64_vita_frame_delta(rdram) == 0; }"

# Compare deadline < current frame. t0 is overwritten before its next use;
# preserve the deferred-store address in the branch's former nop delay slot.
[[patches.instruction]]
func = "func_global_asm_8060F730"
vram = 0x8060F790
value = 0x0319402A
[[patches.instruction]]
func = "func_global_asm_8060F730"
vram = 0x8060F794
value = 0x11000019
[[patches.instruction]]
func = "func_global_asm_8060F730"
vram = 0x8060F798
value = 0x3C01807F

# Both completion paths compute the next deadline with the same frame interval.
# The VI callback must also retain pending work until that deadline. Its original
# body always presented on the next VI, which defeats intervals greater than one.
[[patches.hook]]
func = "func_global_asm_8060F254"
before_vram = 0x8060F368
text = "{ extern int32_t dk64_vita_frame_delta(uint8_t*); if (dk64_vita_frame_delta(rdram) != 0 && MEM_W(0, 0xffffffff80746820ULL) > MEM_W(0x284, ctx->r19)) goto L_8060F420; }"

[[patches.hook]]
func = "func_global_asm_8060F730"
before_vram = 0x8060F7EC
text = "{ extern int32_t dk64_vita_frame_delta(uint8_t*); ctx->r12 = ADD32(ctx->r11, dk64_vita_frame_delta(rdram)); }"
[[patches.hook]]
func = "func_global_asm_8060F254"
before_vram = 0x8060F3B0
text = "{ extern int32_t dk64_vita_frame_delta(uint8_t*); ctx->r12 = ADD32(ctx->r11, dk64_vita_frame_delta(rdram)); }"

# Match patches_main.c: the Nintendo logo also uses the normal 320x240 mode.
# This changes only the value subsequently stored to the byte at 0x8074450C.
[[patches.instruction]]
func = "func_global_asm_805FB944"
vram = 0x805FB980
value = 0x240E0001

[[patches.instruction]]
func = "func_global_asm_80601D24"
vram = 0x80601DE4
value = 0x24150000
