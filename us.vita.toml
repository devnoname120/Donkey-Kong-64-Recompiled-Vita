# upstream 1.4-second display interval. Move the original sound to that handoff.
[[patches.instruction]]
func = "func_global_asm_805FBC5C"
vram = 0x805FBDEC
value = 0x00000000
[[patches.hook]]
func = "func_global_asm_805FBFF4"
before_vram = 0x805FC074
text = "{ extern void dk64_vita_present_boot_logo(uint8_t*, recomp_context*); dk64_vita_present_boot_logo(rdram, ctx); }"

