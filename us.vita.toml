# The original audio loop reads AI_LEN at 0xA4500004 directly. It is a hardware
# register, not RDRAM; use the runtime's queued-audio query as the desktop patch
# does. v0 is reloaded at the following instruction, so this preserves its use.
[[patches.hook]]
func = "func_global_asm_80601EE4"
before_vram = 0x80601F0C
text = "{ extern void osAiGetLength_recomp(uint8_t*, recomp_context*); osAiGetLength_recomp(rdram, ctx); ctx->r3 = ctx->r2; }"
[[patches.instruction]]
func = "func_global_asm_80601EE4"
vram = 0x80601F0C
value = 0x00000000

# Preserve original CPU framebuffer copies/morphing by first making completed
# renderer output visible in the game's word-swapped RDRAM.
[[patches.hook]]
func = "func_global_asm_8070A848"
text = "{ extern void dk64_vita_sync_framebuffer(uint8_t*, uint32_t, uint32_t, uint32_t); dk64_vita_sync_framebuffer(rdram, ctx->r5, MEM_HU(0, 0xffffffff80744490ULL), MEM_HU(0, 0xffffffff80744494ULL)); }"

# Fairy photos read pixels directly instead of using the copy routine above.
# t0 holds the selected framebuffer here; the texture-only fallback has already
# returned, and the original photo allocation and color conversion are retained.
[[patches.hook]]
func = "func_global_asm_806FFF88"
before_vram = 0x806FFFF8
text = "{ extern void dk64_vita_sync_framebuffer(uint8_t*, uint32_t, uint32_t, uint32_t); dk64_vita_sync_framebuffer(rdram, (uint32_t)ctx->r8, MEM_HU(0, 0xffffffff80744490ULL), MEM_HU(0, 0xffffffff80744494ULL)); }"

# patches_framebuffer.c keeps half the sampled lag as f32. Capture the original
# mul.s result before trunc.w.s, then correct its eight consumers. Keep the
# original CPU framebuffer ownership, blur, drawing and deferred-free paths.
[[patches.hook]]
func = "func_global_asm_80629300"
before_vram = 0x80629348
text = "const float dk64_vita_effect_half_lag = ctx->f16.fl;"

# Integer progress is truncated after the addition/subtraction, as upstream's
# compound assignment does: 100 - (1.5 * 5) is 92, not 93.
[[patches.hook]]
func = "func_global_asm_80629300"
before_vram = 0x80629730
text = "ctx->r11 = (int32_t)((float)(int32_t)ctx->r9 - dk64_vita_effect_half_lag * 5.0f);"
[[patches.hook]]
func = "func_global_asm_80629300"
before_vram = 0x806298F8
text = "ctx->r25 = (int32_t)((float)(int32_t)ctx->r2 + dk64_vita_effect_half_lag * 10.0f);"
[[patches.hook]]
func = "func_global_asm_80629300"
before_vram = 0x80629A94
text = "ctx->r14 = (int32_t)((float)(int32_t)ctx->r2 - dk64_vita_effect_half_lag * 10.0f);"
[[patches.hook]]
func = "func_global_asm_80629300"
before_vram = 0x80629D48
text = "ctx->r10 = (int32_t)((float)(int32_t)ctx->r9 + dk64_vita_effect_half_lag * 10.0f);"
[[patches.hook]]
func = "func_global_asm_80629300"
before_vram = 0x80629D50
text = "ctx->r11 = (int32_t)((float)(int32_t)ctx->r3 - dk64_vita_effect_half_lag * 10.0f);"

