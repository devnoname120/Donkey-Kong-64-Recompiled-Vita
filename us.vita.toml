# DK64 US with cooperative frame pacing and the desktop port's 240p mode.
[input]
entrypoint = 0x80000400
symbols_file_path = "DK64Syms/dump.toml"
rom_file_path = "donkeykong64.decompressed.us.z64"
output_func_path = "build/RecompiledFuncsVita"
manual_funcs = [
    { name = "func_global_asm_80612794", section = ".global_asm", vram = 0x80612794, size = 0x6C }
]
function_sizes = [
    { name = "func_global_asm_80612790", size = 0x70 },
    { name = "func_global_asm_80612794", size = 0x6C },
    { name = "func_global_asm_80612D10", size = 0x130 }
]

[patches]
ignored = ["D_global_asm_80611F0C", "D_global_asm_8071FA80", "D_global_asm_8061ACA0"]

