before_vram = 0x8060F368
text = "{ extern int32_t dk64_vita_frame_delta(uint8_t*); if (dk64_vita_frame_delta(rdram) != 0 && MEM_W(0, 0xffffffff80746820ULL) > MEM_W(0x284, ctx->r19)) goto L_8060F420; }"

[[patches.hook]]
