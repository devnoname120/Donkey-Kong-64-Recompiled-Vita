[[patches.hook]]
func = "func_global_asm_8060F254"
before_vram = 0x8060F3B0
text = "{ extern int32_t dk64_vita_frame_delta(uint8_t*); ctx->r12 = ADD32(ctx->r11, dk64_vita_frame_delta(rdram)); }"

